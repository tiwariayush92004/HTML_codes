<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAY6</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
            min-height: 60px;
            width: 100%;
            background-color: aqua;
        }

        ul{
            display: flex;
            justify-content: space-around;
            align-items: center;
            list-style: none; /* REMOVE BULLET POINTS & NUMBERS */
            height: 60px; /* Added height so align-items: center can center items vertically */
        }

        li{
            color: beige;
        }

        li a{
            color: palevioletred;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">BRAND REGISTRATION</a></li>
            <li><a href="#">GALLERY</a></li>
            <li><a href="#">COURSES</a></li> <!-- FIXED: Typo "COURCES" corrected to "COURSES" -->
            <li><a href="#">ABOUT US</a></li>
            <li><a href="#">CONTACT US</a></li>
        </ul>
    </nav>
</body>
</html>
