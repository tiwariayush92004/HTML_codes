<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAY4</title>
    <link rel="stylesheet" href="style4.css">

    <style>
        .coontainer {
            height: 100vh;
            width: 100%;
            display: grid;
            grid-template-columns: auto auto auto;
            padding: 5px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            /*(Flexbox properties invalid on Grid container/children) */
        }

        .boxx1 {
            height: 100px;
            width: 100px;
            background-color: rgba(251, 0, 0, 0.924);
        }

        .boxx2 {
            height: 100px;
            width: 100px;
            background-color: rgb(0, 255, 4);
        }

        .boxx3 {
            height: 100px;
            width: 100px;
            background-color: rgb(215, 9, 226);
        }
    </style>

</head>
<body>

    <div class="coontainer">
        <div class="boxx1"></div>
        <div class="boxx2"></div>
        <div class="boxx3"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
        <div class="boxx1"></div>
    </div>
    
</body>
</html>
